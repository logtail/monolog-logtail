name: E2E

# Proves that the client still delivers logs to Better Stack. Every job creates its own php source through the
# Telemetry API, warms it up, runs example-project/index.php (what its README tells customers to run) with that
# source's token and ingesting host, reads the stored rows back through the testing team's SQL API connection, checks
# them exactly against e2e/expected.json (nothing missing, extra or duplicated), and deletes the source again, together
# with sources of earlier runs left behind for more than 3 hours. The plan job plans three legs:
#   floor   the oldest PHP composer.json allows, with composer update --prefer-lowest: Monolog 3.0.0 and the oldest
#           psr/log it accepts
#   latest  the newest stable PHP with the newest Monolog release on Packagist; composer quietly installing an older
#           Monolog, because composer.json's constraint excludes the newest one (a new major), fails the job
#   canary  PHP nightly with Monolog's main branch, minimum-stability dev
# Pushes to master and pull requests install the client from the checkout, through a path repository. The daily
# schedule installs the newest release from Packagist, pinned exactly, which is what a customer gets today. A failure on
# master or on the schedule files a Linear issue (notify_linear_failure.yml), at low priority when only the canary
# failed.
# Pull requests from forks run only the plan: they get no secrets, so they cannot create a source.
#
# Secrets: TEST_TEAM_TELEMETRY_API, TEST_TEAM_CONNECTION_USERNAME, TEST_TEAM_CONNECTION_PASSWORD (Better Stack's E2E
# testing team), LINEAR_* (see notify_linear_failure.yml).
#
# One leg, or an exact Monolog: Actions → E2E → Run workflow, pick the leg and optionally set monolog-version (a release
# such as 3.9.0, or a commit of Monolog's main branch such as 3bed304), which replaces the planned Monolog of every leg
# that runs. That is how a failure is bisected to one release or commit.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      leg:
        description: 'Leg to run'
        type: choice
        options: [all, floor, latest, canary]
        default: all
      source:
        description: 'checkout: the client from this checkout. packagist: its newest release on Packagist, what a customer installs'
        type: choice
        options: [checkout, packagist]
        default: checkout
      monolog-version:
        description: 'One exact Monolog release (e.g. 3.9.0) or commit of its main branch (e.g. 3bed304) instead of the planned one'
        type: string

permissions:
  contents: read

defaults:
  run:
    # -eo pipefail: a failed curl or php in front of a pipe fails the step.
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: "[Setup] Checkout code"
        uses: actions/checkout@v7

      - name: "[Setup] Plan the legs"
        id: plan
        env:
          LEG: ${{ inputs.leg || 'all' }}
          MONOLOG_VERSION: ${{ inputs.monolog-version }}
          # The schedule tests what a customer installs today, pushes and pull requests test the checkout.
          CLIENT_FROM: ${{ github.event_name == 'schedule' && 'packagist' || inputs.source || 'checkout' }}
        run: |
          # The newest stable release in Packagist's metadata, which is what composer installs from. Its list holds
          # pre-releases such as 3.0.0-RC1 too, so only X.Y.Z versions count.
          newest() {
            curl -fsS "https://repo.packagist.org/p2/$1.json" | jq -er --arg package "$1" '[.packages[$package][].version
              | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last'
          }
          FLOOR_PHP=$(jq -r '.require.php' composer.json | sed -n 's/^>=\([0-9]*\.[0-9]*\)$/\1/p')
          [ -n "$FLOOR_PHP" ] || { echo "::error::composer.json requires PHP $(jq -r '.require.php' composer.json), the plan reads only >=X.Y"; exit 1; }
          NEWEST_MONOLOG=$(newest monolog/monolog) || { echo "::error::Packagist lists no monolog/monolog release"; exit 1; }
          MAIN_REFERENCE=$(curl -fsS 'https://repo.packagist.org/p2/monolog/monolog~dev.json' \
            | jq -er '.packages["monolog/monolog"][] | select(.version == "dev-main") | .source.reference') \
            || { echo "::error::Packagist lists no dev-main of monolog/monolog"; exit 1; }
          CLIENT=checkout
          if [ "$CLIENT_FROM" = packagist ]; then
            CLIENT=$(newest logtail/monolog-logtail) || { echo "::error::Packagist lists no logtail/monolog-logtail release"; exit 1; }
          fi

          # monolog: what the job checks the installed Monolog against (lowest: nothing, it only reports).
          # require: what the job adds to the example's composer.json; the latest leg adds nothing, so that composer
          # picks the newest Monolog composer.json allows and the check sees when that is not the newest release.
          # reference: the commit a dev-main install must be at.
          MATRIX=$(jq -nc --arg leg "$LEG" --arg floor_php "$FLOOR_PHP" --arg newest "$NEWEST_MONOLOG" \
            --arg main "$MAIN_REFERENCE" --arg override "$MONOLOG_VERSION" --arg client "$CLIENT" '
            [ {leg: "floor", php: $floor_php, monolog: "lowest", require: "", reference: ""},
              {leg: "latest", php: "latest", monolog: $newest, require: "", reference: ""},
              {leg: "canary", php: "nightly", monolog: "dev-main", require: "dev-main", reference: $main} ]
            | map(select($leg == "all" or .leg == $leg))
            | map(if $override == "" then .
                elif ($override | test("^[0-9a-f]{7,40}$")) then .monolog = "dev-main" | .require = "dev-main#\($override)" | .reference = $override
                else .monolog = $override | .require = $override | .reference = "" end)
            | map(. + {client: $client, name: "\(.leg) (PHP \(.php), Monolog \(.monolog)\(if .reference != "" then " " + .reference[0:7] else "" end))"})')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          jq . <<<"$MATRIX"

  test:
    needs: plan
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      LEG: ${{ matrix.leg }}
      CLIENT: ${{ matrix.client }}
      PLANNED_MONOLOG: ${{ matrix.monolog }}
      REQUIRE_MONOLOG: ${{ matrix.require }}
      MONOLOG_REFERENCE: ${{ matrix.reference }}
      COMPOSER_NO_INTERACTION: 1

    steps:
      - name: "[Setup] Checkout code"
        uses: actions/checkout@v7

      - name: "[Setup] PHP ${{ matrix.php }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      # The example's composer.json asks for the client from Packagist, as a customer's does. The job changes it in
      # place: the client from the checkout or the exact newest release, and the leg's Monolog.
      - name: "[Setup] Install the client and Monolog"
        working-directory: example-project
        run: |
          if [ "$CLIENT" = checkout ]; then
            # A path repository wins over Packagist for this package. Its version is the checkout's branch, a dev
            # version, hence @dev.
            composer config repositories.checkout '{"type": "path", "url": ".."}'
            composer require --no-update 'logtail/monolog-logtail:@dev'
          else
            # Pinned, so that --prefer-lowest cannot pick an older release of the client.
            composer require --no-update "logtail/monolog-logtail:$CLIENT"
          fi
          if [[ "$REQUIRE_MONOLOG" == dev-* ]]; then composer config minimum-stability dev; fi
          if [ -n "$REQUIRE_MONOLOG" ]; then composer require --no-update "monolog/monolog:$REQUIRE_MONOLOG"; fi
          if [ "$LEG" = floor ]; then
            composer update --no-progress --prefer-dist --prefer-lowest
          else
            composer update --no-progress --prefer-dist
          fi

      - name: "[Verify] Installed versions are the planned ones"
        working-directory: example-project
        run: |
          installed() { composer show --format=json | jq -r --arg package "$1" '.installed[] | select(.name == $package) | .version'; }
          MONOLOG=$(installed monolog/monolog)
          # From the checkout, composer names the client's version after the commit, so the commit is enough.
          if [ "$CLIENT" = checkout ]; then FROM="from the checkout at $(git rev-parse --short HEAD)"; else FROM="$(installed logtail/monolog-logtail) from Packagist"; fi
          INSTALLED="PHP $(php -r 'echo PHP_VERSION;'), logtail/monolog-logtail $FROM, monolog/monolog $MONOLOG, psr/log $(installed psr/log)"
          mkdir -p ../out
          echo "- $INSTALLED" | tee -a ../out/versions.md "$GITHUB_STEP_SUMMARY"
          # The errors of the later steps name the versions: the Linear issue shows them when no read-back summary exists.
          echo "INSTALLED=$INSTALLED" >> "$GITHUB_ENV"

          if [ -n "$MONOLOG_REFERENCE" ]; then
            REFERENCE=$(composer show monolog/monolog --format=json | jq -r '.source.reference')
            if [[ "$REFERENCE" != "$MONOLOG_REFERENCE"* ]]; then
              echo "::error::monolog/monolog $MONOLOG is installed, but the $LEG leg plans Monolog's main branch at $MONOLOG_REFERENCE."
              exit 1
            fi
          elif [ "$PLANNED_MONOLOG" != lowest ] && [ "$MONOLOG" != "$PLANNED_MONOLOG" ]; then
            if [ -z "$REQUIRE_MONOLOG" ]; then
              echo "::error::monolog/monolog $MONOLOG is installed, but the newest release on Packagist is $PLANNED_MONOLOG. This is what the latest leg is for: a newer Monolog that the client's constraint in composer.json (or this PHP) excludes, most likely a new major. Support it and widen the constraint."
            else
              echo "::error::monolog/monolog $MONOLOG is installed, but the $LEG leg asks for $PLANNED_MONOLOG."
            fi
            exit 1
          fi

      # Before a source is created: a client that cannot even load with these versions needs no round trip.
      - name: "[Verify] The client loads with these versions"
        working-directory: example-project
        run: |
          if ! composer validate --strict vendor/logtail/monolog-logtail/composer.json; then
            echo "::error::composer validate --strict fails for the client's composer.json with $INSTALLED"
            exit 1
          fi
          if ! php -r 'require "vendor/autoload.php"; Logtail\Monolog\LogtailHandlerBuilder::withSourceToken("e2e")->build();' > ../out/load.log 2>&1; then
            cat ../out/load.log
            echo "::error::The handler does not load with $INSTALLED: $(grep -m 1 'Fatal error' ../out/load.log || tail -n 1 ../out/load.log)"
            exit 1
          fi
          # Deprecation notices, if any.
          cat ../out/load.log

      - name: "[Setup] Create a source"
        id: source
        uses: ./.github/actions/create-source
        with:
          api-token: ${{ secrets.TEST_TEAM_TELEMETRY_API }}
          name: e2e-php-gh${{ github.run_id }}a${{ github.run_attempt }}-${{ matrix.leg }}
          platform: php

      # The example closes the logger before it prints "All done", so a batch Better Stack rejects ends it with an
      # uncaught LogtailIngestException and a non-zero exit code.
      - name: "[Test] Run the example project"
        working-directory: example-project
        env:
          BETTER_STACK_SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          BETTER_STACK_INGESTING_HOST: ${{ steps.source.outputs.ingesting-host }}
        run: |
          if ! php index.php 2>&1 | tee ../out/example.log; then
            echo "::error::The example project failed with $INSTALLED: $(grep -m 1 'Fatal error' ../out/example.log || tail -n 1 ../out/example.log)"
            exit 1
          fi

      - name: "[Verify] Read the rows back"
        uses: ./.github/actions/verify-logs
        with:
          connection-username: ${{ secrets.TEST_TEAM_CONNECTION_USERNAME }}
          connection-password: ${{ secrets.TEST_TEAM_CONNECTION_PASSWORD }}
          connect-host: ${{ steps.source.outputs.connect-host }}
          collection: ${{ steps.source.outputs.collection }}
          expected: e2e/expected.json

      - name: "[Cleanup] Delete this job's source and stale ones of earlier runs"
        if: ${{ always() }}
        uses: ./.github/actions/cleanup-sources
        with:
          api-token: ${{ secrets.TEST_TEAM_TELEMETRY_API }}
          prefix: e2e-php-
          id: ${{ steps.source.outputs.id }}

      - name: "[Report] Job summary"
        if: ${{ always() }}
        run: |
          if [ -f out/summary.md ]; then
            { echo; cat out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
            # The Linear issue names the job and links the run, so it gets the versions, the read-back and the
            # cleanup only when that left something behind. Without a read-back summary the notifier takes the
            # job's ::error:: lines instead, which name the versions.
            mkdir -p report
            { cat out/versions.md; echo; cat out/summary.md; } > report/summary.md
            if grep -q '❌' out/cleanup.md 2>/dev/null; then { echo; cat out/cleanup.md; } >> report/summary.md; fi
          else
            { echo; echo "❌ Stopped before the rows were read back, see the failed step."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/cleanup.md ]; then { echo; cat out/cleanup.md; } >> "$GITHUB_STEP_SUMMARY"; fi

      - name: "[Report] Hand the summary to the Linear issue"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-summary-${{ matrix.name }}
          path: report/summary.md
          if-no-files-found: ignore
          retention-days: 7
          # A re-run attempt uploads under the same name.
          overwrite: true

  notify-linear:
    if: ${{ failure() && (github.ref == 'refs/heads/master' || github.event_name == 'schedule') }}
    needs: [test]
    # The notifier reads the failed jobs, their summary artifacts and their annotations.
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/notify_linear_failure.yml
    with:
      assignee: petr
      job_summaries: true
    secrets: inherit
